name: Build KernelSU module

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts and configuration
        run: |
          set -eu
          sh -n build.sh boot-completed.sh uninstall.sh scripts/api.sh scripts/lib.sh scripts/worker.sh tests/test.sh tests/policy-rule.sh
          sh tests/test.sh
          sh tests/policy-rule.sh
          node --check webroot/app.js

      - name: Build and verify flashable ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive=$(sh build.sh)
          unzip -t "$archive"
          unzip -p "$archive" module.prop | cmp - module.prop
          unzip -Z -1 "$archive" > dist/zip-entries.txt
          for entry in boot-completed.sh uninstall.sh scripts/api.sh scripts/lib.sh scripts/worker.sh webroot/index.html webroot/app.js webroot/style.css; do
            grep -Fxq "$entry" dist/zip-entries.txt
          done
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            version=$(sed -n 's/^version=//p' module.prop | head -n 1)
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "Tag must be v$version" >&2; exit 1; }
          fi
          sha256sum "$archive"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-lan-ip-zip
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: droidspaces-lan-ip-zip
          path: dist

      - name: Attach ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --verify-tag
          fi
